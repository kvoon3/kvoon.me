minimumReleaseAgeExclude:
  - '@iconify-json/simple-icons@1.2.91'
  - '@nuxt/kit@4.5.0'
  - '@nuxt/nitro-server@4.5.0'
  - '@nuxt/schema@4.5.0'
  - '@nuxt/vite-builder@4.5.0'
  - nuxt@4.5.0
shellEmulator: true

trustPolicy: no-downgrade

packages:
  - packages/*

overrides:
  semver: ^7.8.5

onlyBuiltDependencies: [better-sqlite3, sharp]

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  exifreader: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
